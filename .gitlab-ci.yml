stages: [test, deploy]

.php-test:
  stage: test
  image: php:${PHP_VERSION}-cli
  before_script:
    - apt-get update -qq && apt-get install -qq -y git unzip > /dev/null
    # Composer's documented installer verification: the installer's sha384 is published on a second host.
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php -r "if (hash_file('sha384', 'composer-setup.php') !== trim(file_get_contents('https://composer.github.io/installer.sig'))) { echo 'Composer installer checksum mismatch'; unlink('composer-setup.php'); exit(1); }"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer && rm composer-setup.php
    - composer install --no-interaction --no-progress
  script:
    - composer phpstan
    - composer test

test:php8.1: { extends: .php-test, variables: { PHP_VERSION: "8.1" } }
test:php8.3: { extends: .php-test, variables: { PHP_VERSION: "8.3" } }
test:php8.4: { extends: .php-test, variables: { PHP_VERSION: "8.4" } }
test:php8.5: { extends: .php-test, variables: { PHP_VERSION: "8.5" } }

docs:build:
  stage: test
  image: python:3.12-slim
  script:
    - pip install mkdocs pymdown-extensions
    - mkdocs build --strict
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: python:3.12-slim
  script:
    - pip install mkdocs pymdown-extensions
    - mkdocs build --strict --site-dir public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

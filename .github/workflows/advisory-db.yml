# The legacy location of the advisory database.
#
# The database is built and published by its release channel, https://github.com/hexblot/composer-remediate-db.
# Clients up to 0.11 were released with this repository's `advisory-db-latest` release as their default
# source, so this workflow keeps that release current from the channel: it fetches what the channel
# published, checks the checksum and the build-provenance attestation, and republishes the same bytes
# here. Nothing is built here, no dated releases are created here, and this workflow is removed when
# 1.0 is released.
#
#   https://github.com/hexblot/composer-remediate/releases/download/advisory-db-latest/advisories.sqlite
name: advisory-db

on:
  schedule:
    # Shortly after the channel's own schedule (17 */6), so a new publication is mirrored within the hour.
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Republish even when the mirrored copy already carries the channel's sha256
        type: boolean
        default: false

env:
  CHANNEL: hexblot/composer-remediate-db

permissions: {}

concurrency:
  group: advisory-db
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # The environment's deployment-branch policy (main only) is enforced by GitHub before this job
    # starts; it is the only job, and it writes nothing but the one release.
    environment: advisory-db
    permissions:
      contents: write       # gh release upload / edit on advisory-db-latest
    steps:
      - name: Compare the channel's publication with the mirrored copy
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          gh release download advisory-db-latest --repo "$CHANNEL" --pattern latest.json --dir channel
          set +e
          gh release download advisory-db-latest --pattern latest.json --dir mirrored 2>/dev/null
          set -e
          published=$(jq -r '.sha256 // empty' channel/latest.json)
          mirrored=$(jq -r '.sha256 // empty' mirrored/latest.json 2>/dev/null || true)
          test -n "$published"
          echo "version=$(jq -r '.version // empty' channel/latest.json)" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$mirrored" ] && [ "$FORCE_INPUT" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "The mirrored copy already carries $published; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "The channel publishes $published, the mirror carries ${mirrored:-nothing}."
          fi
      - name: Fetch the publication
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out && mkdir out
          gh release download advisory-db-latest --repo "$CHANNEL" --dir out \
            --pattern advisories.sqlite --pattern advisories.sqlite.sha256 --pattern latest.json
      # What is republished here is vouched for by the channel, not by this workflow: the bytes have to
      # be the ones the channel's latest.json names, and the channel's own build has to have attested
      # them. A mirror that re-signed whatever it downloaded would add a signature and no assurance.
      - name: Check the checksum and the channel's attestation
        if: steps.compare.outputs.changed == 'true'
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c advisories.sqlite.sha256
          test "$(jq -r .sha256 latest.json)" = "$(cut -d' ' -f1 advisories.sqlite.sha256)"
          gh attestation verify advisories.sqlite --repo "$CHANNEL"
      - name: Republish at the legacy location
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh cannot read the remote to learn which repository it acts on.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.compare.outputs.version }}
        run: |
          notes="Moving pointer to the newest advisory database ($VERSION), mirrored from https://github.com/$CHANNEL, which is where the database is built and published. This location is kept current for clients up to composer-remediate 0.11 and stops being updated when composer-remediate 1.0 is released. Newer clients read https://github.com/$CHANNEL/releases/download/advisory-db-latest/advisories.sqlite by default, and a pinned CI configuration should move to that URL now. Dated releases are no longer created here."
          if gh release view advisory-db-latest >/dev/null 2>&1; then
            gh release upload advisory-db-latest out/advisories.sqlite out/advisories.sqlite.sha256 out/latest.json --clobber
            gh release edit advisory-db-latest --notes "$notes"
          else
            gh release create advisory-db-latest out/advisories.sqlite out/advisories.sqlite.sha256 out/latest.json \
              --title "Advisory database (latest, mirrored)" --prerelease --notes "$notes"
          fi

  # A scheduled workflow fails quietly. A mirror that stops is a stale default for every client up to
  # 0.11, which confirm their copy by content and report its age, so nobody is told a stale database is
  # current, but it does go stale. One issue, commented on rather than refiled.
  alert:
    needs: mirror
    if: always() && needs.mirror.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The advisory database mirror is failing"
          body="The \`advisory-db\` workflow, which mirrors the release channel's publication to this repository's \`advisory-db-latest\` release, failed.

          $RUN_URL

          Until this is fixed the legacy location stops being updated; clients up to 0.11 confirm their copy by content and report its age. Close this issue once a run has mirrored again."
          existing=$(gh issue list --state open --label advisory-db --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create advisory-db --description "Advisory database publishing" --color B60205 2>/dev/null || true
            gh issue create --title "$title" --label advisory-db --body "$body"
          fi

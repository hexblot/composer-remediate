# Reference shared advisory database.
#
# Builds the SQLite advisory database from Packagist, OSV and FriendsOfPHP every six hours and publishes
# it as a GitHub release ONLY when the logical dataset changed (the dataset hash differs from the one
# in the current `latest.json`). Releases are tagged db-YYYY-MM-DD.HH (a .N suffix disambiguates
# several publications in one hour). Each release carries the database, its sha256, latest.json, and
# a build-provenance attestation. Users point at the stable URL of `latest.json` or the database:
#
#   https://github.com/hexblot/composer-remediate/releases/download/advisory-db-latest/advisories.sqlite
#
# The `advisory-db-latest` release is a moving pointer updated alongside each dated release.
name: advisory-db

on:
  schedule:
    # Every six hours. Publication only happens when the dataset hash moved, and clients confirm their
    # copy by content and report its age, so a publication a few hours behind the feeds costs nothing
    # that hourly polling (about 70 job-minutes a day) would buy back.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when the dataset hash is unchanged
        type: boolean
        default: false

permissions: {}

concurrency:
  group: advisory-db
  cancel-in-progress: false

# The build holds no credentials that can change anything. It resolves Composer dependencies, runs this
# project's own code and reads three upstream feeds, none of which should ever be a step away from the
# token that publishes a release. Everything it produces is handed to the publish job as an artifact,
# and that job runs nothing but the attestation action and `gh`.
jobs:
  build:
    runs-on: ubuntu-latest
    # A workflow_dispatch from another branch runs that branch's copy of this file, so nothing written
    # here can stop it on its own. The `advisory-db` environment's deployment-branch policy (main only)
    # is enforced by GitHub before the publish job starts, whatever the workflow says; the ref check
    # here is only a clearer error for an accidental dispatch from a branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip
          tools: composer:v2
      - name: Install the plugin from this checkout
        run: |
          composer global config --no-plugins repositories.remediate path "$GITHUB_WORKSPACE"
          composer global config --no-plugins allow-plugins.hexblot/composer-remediate true
          composer global require hexblot/composer-remediate:@dev --no-progress --no-scripts
      - name: Build
        run: |
          mkdir -p out
          composer remediate:db-build --output=out/advisories.sqlite
          php -r '$m = (new PDO("sqlite:out/advisories.sqlite"))->query("SELECT key, value FROM meta")->fetchAll(PDO::FETCH_KEY_PAIR); file_put_contents("out/meta.json", json_encode($m, JSON_PRETTY_PRINT));'
          jq -r .dataset_hash out/meta.json > out/hash
          (cd out && sha256sum advisories.sqlite > advisories.sqlite.sha256)   # digest + filename, so `sha256sum -c` works
          echo "hash=$(cat out/hash)" >> "$GITHUB_OUTPUT"
        id: build
      - name: Compare with the published dataset
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          # Expressions are passed through the environment, never interpolated into the script.
          BUILD_HASH: ${{ steps.build.outputs.hash }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set +e
          gh release download advisory-db-latest --pattern latest.json --dir prev 2>/dev/null
          set -e
          previous=$(jq -r '.dataset_hash // empty' prev/latest.json 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ "$previous" = "$BUILD_HASH" ] && [ "$FORCE_INPUT" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Dataset unchanged ($previous); nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Choose the release version
        if: steps.compare.outputs.changed == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="db-$(date -u +%Y-%m-%d.%H)"
          version="$base"; n=1
          while gh release view "$version" >/dev/null 2>&1; do version="$base.$n"; n=$((n+1)); done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write latest.json
        if: steps.compare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_HASH: ${{ steps.build.outputs.hash }}
          PREVIOUS: ${{ steps.compare.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n --arg v "$VERSION" --arg h "$BUILD_HASH" \
                --arg s "$(cut -d" " -f1 out/advisories.sqlite.sha256)" --arg p "$PREVIOUS" --arg r "$REPOSITORY" \
                --argjson m "$(cat out/meta.json)" \
                '{version: $v, database: "advisories.sqlite", sha256: $s, dataset_hash: $h, published_at: $m.built_at,
                  advisory_count: ($m.advisory_count|tonumber), conflict_count: ($m.conflict_count|tonumber),
                  sources: ($m.sources|fromjson), previous: (if $p == "" then null else $p end),
                  url: ("https://github.com/" + $r + "/releases/download/" + $v + "/advisories.sqlite")}' > out/latest.json
          cat out/latest.json
      - name: Hand the artefacts to the publish job
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-db
          path: |
            out/advisories.sqlite
            out/advisories.sqlite.sha256
            out/latest.json
          retention-days: 1
          if-no-files-found: error
      - name: Record health
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          BUILD_HASH: ${{ steps.build.outputs.hash }}
        run: echo "last_successful_poll=$(date -u +%FT%TZ) changed=$CHANGED hash=$BUILD_HASH"

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The environment's deployment-branch policy (main only) is enforced by GitHub before this job
    # starts, and it is the only job that can write to the repository.
    environment: advisory-db
    permissions:
      contents: write       # gh release create / upload
      id-token: write       # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: advisory-db
          path: out
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/advisories.sqlite
      - name: Publish dated release and move the latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_HASH: ${{ needs.build.outputs.hash }}
          REPOSITORY: ${{ github.repository }}
        run: |
          v="$VERSION"
          gh release create "$v" out/advisories.sqlite out/advisories.sqlite.sha256 out/latest.json \
            --title "Advisory database $v" --latest=false \
            --notes "Advisory database built from Packagist, OSV and FriendsOfPHP. Dataset hash $BUILD_HASH. Use with \`composer remediate --database-location=https://github.com/$REPOSITORY/releases/download/$v/advisories.sqlite\`. Aggregated advisory data; see docs/advisory-database.md for source licences."
          if gh release view advisory-db-latest >/dev/null 2>&1; then
            gh release upload advisory-db-latest out/advisories.sqlite out/advisories.sqlite.sha256 out/latest.json --clobber
            gh release edit advisory-db-latest --notes "Moving pointer to the newest advisory database ($v). Prefer the dated release URL in pinned CI configurations."
          else
            gh release create advisory-db-latest out/advisories.sqlite out/advisories.sqlite.sha256 out/latest.json \
              --title "Advisory database (latest)" --prerelease \
              --notes "Moving pointer to the newest advisory database ($v). Prefer the dated release URL in pinned CI configurations."
          fi

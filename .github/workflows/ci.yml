name: ci

on:
  # Documentation-only changes are built and deployed by the docs workflow; the matrix does not run for
  # them, except for the generated pages and the schema, which this workflow checks for staleness.
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/case-studies.md'
      - 'docs/cli-reference.md'
      - 'docs/schema/**'
      - '!mkdocs.yml'
      - '!*.md'
      - '!.gitlab-ci.yml'
      - '!.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/case-studies.md'
      - 'docs/cli-reference.md'
      - 'docs/schema/**'
      - '!mkdocs.yml'
      - '!*.md'
      - '!.gitlab-ci.yml'
      - '!.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the PHP 8.4 job publishes the coverage badge to the `badges` branch
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # PCOV adds little to the run time, unlike Xdebug; one job measures, the others run plain.
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer phpstan
      - run: composer test
        if: matrix.php != '8.4'
      - name: Tests with coverage
        if: matrix.php == '8.4'
        run: |
          mkdir -p build/coverage
          vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover build/coverage/clover.xml --coverage-html build/coverage/html | tee build/coverage/phpunit.txt
          { echo '### Code coverage (PHP 8.4, PCOV)'; echo; echo '```'; grep -E 'Classes:|Methods:|Lines:' build/coverage/phpunit.txt || echo 'summary not found in PHPUnit output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.php == '8.4'
        with:
          name: coverage
          path: build/coverage
          retention-days: 14
      - name: Publish the coverage badge
        if: matrix.php == '8.4' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          php -r '
            $m = simplexml_load_file("build/coverage/clover.xml")->project->metrics;
            $pct = (int) $m["statements"] > 0 ? 100 * (int) $m["coveredstatements"] / (int) $m["statements"] : 0;
            $color = $pct >= 90 ? "brightgreen" : ($pct >= 75 ? "green" : ($pct >= 60 ? "yellowgreen" : ($pct >= 45 ? "yellow" : "orange")));
            file_put_contents("coverage.json", json_encode(["schemaVersion" => 1, "label" => "coverage", "message" => sprintf("%.1f%%", $pct), "color" => $color]));
            echo file_get_contents("coverage.json"), PHP_EOL;
          '
          mkdir -p /tmp/badges && cp coverage.json /tmp/badges/ && cd /tmp/badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Coverage badge for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
      - name: CLI reference is up to date
        if: matrix.php == '8.4'
        run: php bin/cli-reference.php | diff -u docs/cli-reference.md - || (echo "::error::docs/cli-reference.md is stale; run php bin/cli-reference.php > docs/cli-reference.md" && exit 1)
      - name: Case studies page is up to date
        if: matrix.php == '8.4'
        run: php bin/case-studies.php | diff -u docs/case-studies.md - || (echo "::error::docs/case-studies.md is stale; run php bin/case-studies.php > docs/case-studies.md" && exit 1)
  composer-matrix:
    name: composer ${{ matrix.composer }} on php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', composer: '2.4.*' }   # runtime floor
          - { php: '8.2', composer: '2.7.*' }
          - { php: '8.3', composer: '2.8.*' }   # last release without --minimal-changes
          - { php: '8.4', composer: '2.9.*' }
    env:
      COMPOSER_NO_BLOCKING: '1'   # older composer/composer releases carry advisories; that is the point
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - env:
          COMPOSER_CONSTRAINT: ${{ matrix.composer }}
        run: composer require --dev "composer/composer:${COMPOSER_CONSTRAINT}" --with-all-dependencies --no-interaction --no-progress
      - run: composer show composer/composer | grep versions
      - run: composer test
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install mkdocs pymdown-extensions
      - run: mkdocs build --strict

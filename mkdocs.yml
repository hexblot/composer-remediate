site_name: Composer Remediate
site_description: From vulnerable dependency to verified Composer fix.
site_url: https://hexblot.github.io/composer-remediate/
repo_url: https://github.com/hexblot/composer-remediate
edit_uri: edit/main/docs/
strict: true

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages: [php, json, yaml, bash]
  navigation_depth: 3
  titles_only: false

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: false
      clickable_checkbox: false

nav:
  - Home: index.md
  - Use it:
      - Getting started: getting-started.md
      - Reading the report: reading-the-report.md
      - CLI reference: cli-reference.md
  - Understand it:
      - How it works: how-it-works.md
      - Privacy and network behaviour: privacy-and-network.md
      - Advisory database: advisory-database.md
  - Integrate it:
      - CI integration: ci-integration.md
  - Evidence:
      - Case studies: case-studies.md
      - Comparison with other tools: comparison.md
  - Project:
      - Roadmap: roadmap.md
      - Design decisions: design-decisions.md
      - Contributing: contributing.md
      - Test fixtures: fixtures.md
